[project]
name = "arithmetic-post-training"
version = "0.1.0"
description = "Post-training small language models on arithmetic tasks."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate==1.15.0",
    "datasets==5.1.0",
    "matplotlib==3.11.2",
    "pandas==3.0.6",
    "peft==0.21.2",
    "torch==2.14.1",
    "transformers==5.18.0",
    "trl==1.16.0",
]

[dependency-groups]
dev = [
    "ipykernel==7.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arithmetic_post_training"]